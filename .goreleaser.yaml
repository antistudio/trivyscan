# .goreleaser.yaml
# GoReleaser v2 configuration for TrivyScan

version: 2

project_name: trivyscan

before:
  hooks:
    - go mod tidy

builds:
  - id: trivyscan
    main: ./main.go
    binary: trivyscan
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    goarm:
      - v7
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
    flags:
      - -tags=net
    env:
      - CGO_ENABLED=0

archives:
  # Linux archives - include install.sh and update.sh
  - id: linux
    format: zip
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- .Arch }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    builds:
      - trivyscan
    files:
      - LICENSE*
      - README*
      - src: scripts/install.sh
        dst: install.sh
        strip_parent: true
      - src: scripts/update.sh
        dst: update.sh
        strip_parent: true
    rlcp: true
    filter:
      goos:
        - linux

  # macOS archives - include install.sh and update.sh
  - id: darwin
    format: zip
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- .Arch }}
    builds:
      - trivyscan
    files:
      - LICENSE*
      - README*
      - src: scripts/install.sh
        dst: install.sh
        strip_parent: true
      - src: scripts/update.sh
        dst: update.sh
        strip_parent: true
    rlcp: true
    filter:
      goos:
        - darwin

  # Windows archives - include only .bat files (no PowerShell)
  - id: windows
    format: zip
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- .Arch }}
    builds:
      - trivyscan
    files:
      - LICENSE*
      - README*
      - src: scripts/install.bat
        dst: install.bat
        strip_parent: true
      - src: scripts/update.bat
        dst: update.bat
        strip_parent: true
    rlcp: true
    filter:
      goos:
        - windows

snapshot:
  version_template: "dev"

checksum:
  algorithm: sha256

release:
  github:
    owner: anhnmt
    name: trivyscan