# .goreleaser.yaml
# GoReleaser v2 configuration for TrivyScan

version: 2

project_name: trivyscan

before:
  hooks:
    - go mod tidy

builds:
  - id: trivyscan
    main: ./main.go
    binary: trivyscan
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    goarm:
      - v7
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
    flags:
      - -tags=net
    env:
      - CGO_ENABLED=0

archives:
  - id: trivyscan
    format: zip
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- .Arch }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    files:
      - LICENSE*
      - README*
      - CHANGELOG*

snapshot:
  version_template: "dev"

checksum:
  algorithm: sha256

release:
  github:
    owner: anhnmt
    name: trivyscan