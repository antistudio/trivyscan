version: 2

project_name: trivyscan

before:
  hooks:
    - go mod tidy

# Two builds of the same package so each archive can ship only its own installer.
# main must be the package (.), not ./main.go: the code is split over several files.
builds:
  - id: trivyscan-unix
    main: .
    binary: trivyscan
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
    flags:
      - -tags=net
    env:
      - CGO_ENABLED=0

  - id: trivyscan-windows
    main: .
    binary: trivyscan
    goos:
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
    flags:
      - -tags=net
    env:
      - CGO_ENABLED=0

# One archive per OS/arch: trivyscan_<ver>_<os>_<arch>.tar.gz (zip on Windows).
# scripts/install.sh and install.ps1 download these names; keep them in sync.
archives:
  - id: unix
    ids: [trivyscan-unix]
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - INSTALL.md
      - LICENSE
      - src: scripts/install.sh
        dst: .
        strip_parent: true

  - id: windows
    ids: [trivyscan-windows]
    formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - INSTALL.md
      - LICENSE
      - src: scripts/install.ps1
        dst: .
        strip_parent: true

snapshot:
  version_template: "dev"

checksum:
  name_template: "{{ .ProjectName }}_{{ .Version }}_checksums.txt"
  algorithm: sha256

release:
  github:
    owner: anhnmt
    name: trivyscan
