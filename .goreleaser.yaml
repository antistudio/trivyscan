# .goreleaser.yaml
# GoReleaser v2 configuration for TrivyScan

version: 2

project_name: trivyscan

before:
  hooks:
    - go mod tidy

builds:
  - id: trivyscan
    main: ./main.go
    binary: "trivyscan_{{ .Os }}_{{ .Arch }}"
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
    flags:
      - -tags=net
    env:
      - CGO_ENABLED=0

archives:
  # All-in-one AMD64 archive: linux + darwin + windows
  - id: amd64
    formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_amd64"
    meta: true
    files:
      - INSTALL*
      - src: scripts/install.sh
        dst: .
        strip_parent: true
      - src: scripts/update.sh
        dst: .
        strip_parent: true
      - src: scripts/install.ps1
        dst: .
        strip_parent: true
      - src: scripts/update.ps1
        dst: .
        strip_parent: true
      - src: "dist/trivyscan_linux_amd64_v1/trivyscan_linux_amd64"
        dst: .
        strip_parent: true
      - src: "dist/trivyscan_darwin_amd64_v1/trivyscan_darwin_amd64"
        dst: .
        strip_parent: true
      - src: "dist/trivyscan_windows_amd64_v1/trivyscan_windows_amd64.exe"
        dst: .
        strip_parent: true

  # All-in-one ARM64 archive: linux + darwin + windows
  - id: arm64
    formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_arm64"
    meta: true
    files:
      - INSTALL*
      - src: scripts/install.sh
        dst: .
        strip_parent: true
      - src: scripts/update.sh
        dst: .
        strip_parent: true
      - src: scripts/install.ps1
        dst: .
        strip_parent: true
      - src: scripts/update.ps1
        dst: .
        strip_parent: true
      - src: "dist/trivyscan_linux_arm64_v8.0/trivyscan_linux_arm64"
        dst: .
        strip_parent: true
      - src: "dist/trivyscan_darwin_arm64_v8.0/trivyscan_darwin_arm64"
        dst: .
        strip_parent: true
      - src: "dist/trivyscan_windows_arm64_v8.0/trivyscan_windows_arm64.exe"
        dst: .
        strip_parent: true

snapshot:
  version_template: "dev"

checksum:
  algorithm: sha256

release:
  github:
    owner: anhnmt
    name: trivyscan